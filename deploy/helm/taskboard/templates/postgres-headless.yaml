apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.dbHost" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
