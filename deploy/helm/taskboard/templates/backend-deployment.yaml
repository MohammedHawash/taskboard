apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.backendName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "taskboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          # -U is required: a UID without a user name would otherwise never connect
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "taskboard.dbHost" . }} -p 5432 -U {{ .Values.postgres.user }}; do
                echo "waiting for database..."; sleep 2;
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - {name: DB_HOST, value: {{ include "taskboard.dbHost" . | quote }}}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: {{ .Values.postgres.db | quote }}}
            - {name: DB_USER, value: {{ .Values.postgres.user | quote }}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskboard.secretName" . }}
                  key: password
            - {name: APP_VERSION, value: {{ .Values.backend.image.tag | quote }}}
            - {name: ENVIRONMENT, value: {{ .Values.backend.environment | quote }}}
          readinessProbe:
            httpGet: {path: /api/health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
