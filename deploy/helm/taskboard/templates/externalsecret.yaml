{{- if eq .Values.secret.mode "external" }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-aws
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secret.external.region }}
      # no auth block: ESO uses its own EKS Pod Identity credentials
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Release.Name }}-aws
    kind: SecretStore
  target:
    name: {{ include "taskboard.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secret.external.remoteKey }}
        property: {{ .Values.secret.external.property }}
{{- end }}
