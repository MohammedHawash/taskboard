# EKS: ECR image, ExternalSecret, TargetGroupBinding.  Fill CHANGE_ME from `terraform output`.
backend:
  image:
    repository: CHANGE_ME   # ecr_repository_url  e.g. 123456789012.dkr.ecr.eu-west-1.amazonaws.com/taskboard-backend
    tag: CHANGE_ME          # release workflow updates this (v1.0.0)
    pullPolicy: IfNotPresent
  replicas: 2
  environment: production
postgres:
  storage:
    size: 5Gi
    storageClass: ""        # EBS CSI add-on default class (gp3)
secret:
  mode: external
  external:
    region: eu-west-1
    remoteKey: taskboard-prod/db-password
    property: password
targetGroupBinding:
  enabled: true
  targetGroupArn: CHANGE_ME # backend_target_group_arn
