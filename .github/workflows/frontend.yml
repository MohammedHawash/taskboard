name: Frontend
on:
  pull_request:
  push:
    branches: [main]
    paths: ["app/frontend/**", ".github/**"]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend scan, lint, build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app/frontend}}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/pre-build-scan
        with:
          scan-path: app/frontend
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-organization: ${{ vars.SONAR_ORGANIZATION }}
          sonar-project-key: ${{ vars.SONAR_ORGANIZATION }}_taskboard-frontend
          sonar-sources: app/frontend
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: ./.github/actions/post-build-scan
        with: {scan-type: fs, target: app/frontend/out, severity: "HIGH,CRITICAL"}
