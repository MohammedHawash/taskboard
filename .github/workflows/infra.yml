name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".trivyignore"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".trivyignore"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS }}

defaults:
  run:
    working-directory: infra/environments/prod

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: IaC security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Debug OIDC claims safely
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          python3 -c '
          import sys, json, base64

          response = json.load(sys.stdin)
          token = response["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          ' <<< "$response"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform fmt -check -recursive ../..

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: infrastructure

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - run: terraform apply -input=false -auto-approve -lock-timeout=10m
