name: Infrastructure
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml", ".trivyignore"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml", ".trivyignore"]
permissions:
  contents: read
  id-token: write
  pull-requests: write
concurrency:
  group: terraform-prod        # never two runs on the same state
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS }}
defaults:
  run: {working-directory: infra/environments/prod}
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: IaC security scan
        uses: aquasecurity/trivy-action@v0.36.0   # TODO pin SHA
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "~1.10"}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform validate
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt
          { echo '### Terraform plan'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: infrastructure          # required reviewer = manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "~1.10"}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform apply -input=false -auto-approve -lock-timeout=10m
